# 小i跑腿 — Nginx 配置
# 本地: 替换 server_name + proxy_pass 地址
# Docker: 直接使用，upstream backend 由 compose 网络 DNS 解析
#
# 启动: nginx -c F:/ikeu_runningerrands/docker/nginx/nginx.conf
# 重载: nginx -s reload

worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── 本地开发 upstream ──────────────────────────
    # Docker 部署时改为: server backend:8080;
    upstream backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── 小i跑腿 ────────────────────────────────────
    server {
        listen       80;
        server_name  localhost;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (STOMP 聊天 + 通知推送)
        location /api/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 后端 REST API
        location /api/admin/    { proxy_pass http://backend; }
        location /api/user/     { proxy_pass http://backend; }
        location /api/common/   { proxy_pass http://backend; }

        # 管理端静态资源 (长期缓存)
        location /api/assets/ {
            alias F:/ikeu_runningerrands/admin/dist/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /api/logo.svg {
            alias F:/ikeu_runningerrands/admin/dist/logo.svg;
        }

        # SPA 兜底 — Vue Router history 模式
        location /api/ {
            alias F:/ikeu_runningerrands/admin/dist/;
            try_files $uri /api/index.html;
        }
    }
}
